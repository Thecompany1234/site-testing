<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <!-- Container -->
    <div class="w-full max-w-md">

        <!-- LOGIN CARD -->
        <div id="login-card" class="glass rounded-2xl shadow-2xl p-8 border border-white/20 transition-all duration-300 transform">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 mb-4 shadow-inner">
                    <i class="fa-solid font-bold text-2xl fa-lock"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Welcome Back</h2>
                <p class="text-sm text-gray-500 mt-1">Please sign in to your account</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username or Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="text" id="username" required
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none text-gray-700 text-sm"
                            placeholder="user@example.com">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" id="password" required
                            class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none text-gray-700 text-sm"
                            placeholder="••••••••">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                            <i id="eye-icon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-gray-600 cursor-pointer">
                        <input type="checkbox" id="remember-me" checked class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                        <span class="ml-2 text-xs text-gray-600">Remember session</span>
                    </label>
                    <a href="#" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">Forgot password?</a>
                </div>

                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition-all shadow-lg shadow-indigo-500/30 active:scale-[0.99]">
                    Sign In
                </button>
            </form>
        </div>

        <!-- DASHBOARD CARD (Visible when logged in) -->
        <div id="dashboard-card" class="hidden glass rounded-2xl shadow-2xl p-8 border border-white/20 text-center transition-all duration-300">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-100 text-green-600 mb-4 shadow-inner">
                <i class="fa-solid fa-circle-check text-3xl"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-gray-800 mb-2">Log in</h2>
            <p id="welcome-message" class="text-gray-600 text-sm mb-6">You are authenticated!</p>

            <div class="bg-indigo-50/70 border border-indigo-100 rounded-xl p-4 mb-6 text-left">
                <div class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-1">Session Info</div>
                <div class="text-sm text-gray-700">
                    <span class="font-medium">User:</span> <span id="session-username" class="text-indigo-600 font-semibold"></span>
                </div>
                <div class="text-sm text-gray-700">
                    <span class="font-medium">Status:</span> <span class="inline-flex items-center text-xs font-semibold px-2 py-0.5 rounded-full bg-green-100 text-green-800">Active Session</span>
                </div>
            </div>

            <button onclick="handleLogout()"
                class="w-full bg-red-500 hover:bg-red-600 text-white font-medium py-2.5 rounded-xl transition-all shadow-lg shadow-red-500/20 active:scale-[0.99] flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-from-bracket"></i>
                Log Out
            </button>
        </div>

    </div>

    <script>
        // DOM Elements
        const loginCard = document.getElementById('login-card');
        const dashboardCard = document.getElementById('dashboard-card');
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const sessionUsername = document.getElementById('session-username');

        // Check if session exists in localStorage on page load
        window.addEventListener('DOMContentLoaded', () => {
            const storedUser = localStorage.getItem('user_session');
            if (storedUser) {
                try {
                    const userData = JSON.parse(storedUser);
                    showDashboard(userData.username);
                } catch (e) {
                    localStorage.removeItem('user_session');
                }
            }
        });

        // Handle Login Submission
        function handleLogin(event) {
            event.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (username && password) {
                // Save user session into localStorage
                const userSession = {
                    username: username,
                    loginTime: new Date().toISOString()
                };

                localStorage.setItem('user_session', JSON.stringify(userSession));
                
                // Switch UI view
                showDashboard(username);

                // Reset form
                loginForm.reset();
            }
        }

        // Handle Logout
        function handleLogout() {
            // Remove session from localStorage
            localStorage.removeItem('user_session');

            // Switch to Login UI
            dashboardCard.classList.add('hidden');
            loginCard.classList.remove('hidden');
        }

        // Show Dashboard UI
        function showDashboard(username) {
            sessionUsername.textContent = username;
            loginCard.classList.add('hidden');
            dashboardCard.classList.remove('hidden');
        }

        // Toggle Password Visibility
        function togglePasswordVisibility() {
            const eyeIcon = document.getElementById('eye-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
