<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Google Sheets Auth Example</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
    input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; }
    button.secondary { background: #6c757d; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card" id="authCard">
    <h2>Sign In / Sign Up</h2>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="handleAuth('login')">Log In</button>
    <button class="secondary" onclick="handleAuth('signup')">Create Account</button>
    <div id="status"></div>
  </div>

  <script>
    // Paste your deployed Google Apps Script Web App URL here
    const SCRIPT_URL = "https://script.google.com/a/macros/acsd1.org/s/AKfycbxLF_Dl429Q9QNLzG_URiDU3oFKJaapJOOi4_3GSV3GsX8bhbevVP1u2G93eUNTQmuh8g/exec";

    // Auto log-in check on page load using LocalStorage
    window.onload = () => {
      const savedUser = localStorage.getItem("loggedInUser");
      if (savedUser) {
        showLoggedInState(savedUser);
      }
    };

    async function handleAuth(action) {
      const usernameInput = document.getElementById("username").value.trim();
      const passwordInput = document.getElementById("password").value;
      const statusDiv = document.getElementById("status");

      if (!usernameInput || !passwordInput) {
        statusDiv.innerText = "Please fill in all fields.";
        return;
      }

      statusDiv.innerText = "Connecting to Google Sheet...";

      try {
        // Fetch to Google Apps Script endpoint using no-cors handling or text response parsing
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight issues with Apps Script
          body: JSON.stringify({ action: action, username: usernameInput, password: passwordInput })
        });

        const result = await response.json();

        if (result.success) {
          if (action === "login" || action === "signup") {
            localStorage.setItem("loggedInUser", usernameInput);
            showLoggedInState(usernameInput);
          }
        } else {
          statusDiv.innerText = result.message;
        }
      } catch (err) {
        statusDiv.innerText = "Error connecting to server.";
        console.error(err);
      }
    }

    function showLoggedInState(username) {
      document.getElementById("authCard").innerHTML = `
        <h2>Log in</h2>
        <p>Welcome back, <strong>${username}</strong>!</p>
        <button onclick="logout()">Sign Out</button>
      `;
    }

    function logout() {
      localStorage.removeItem("loggedInUser");
      location.reload();
    }
  </script>
</body>
</html>
